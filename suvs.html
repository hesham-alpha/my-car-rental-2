<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUVs | MyCarRental</title>
    <style>

        body{
            margin: 0;
        }
        .header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: none;
        }
        .header-links a{
            display: inline-block;
            margin: 0 10px;
            text-decoration: none;
            color: black;
            transition: 0.3s ease;
            padding-bottom: 10px;
        }
        .header-actions a{
            display: inline-block;
            margin: 0 10px;
            text-decoration: none;
            color: black;
            transition: 0.3s ease;
        }
        .header-actions .register-btn{
            background-color: black;
            color: white;
            padding: 10px 20px;
            border-radius: 35px;
        }
        .header-actions .register-btn:hover{
            background-color: rgba(184, 174, 174, 0.815);
            color: black;
            transition: 0.3s;
            transform: scale(1.1);
        }
        .header-links a:hover{
            transform: translateY(-5px);
            text-shadow: 0px 3px 5px gray;
        }
        .header-actions a:hover{
            transform: scale(1.1);
            transition: 0.3s;
        }
        .header h1{
            margin-bottom: 5px;
            margin-left: 10px;
        }
        .header p{
            margin-top: 0;
            color: gray;
            margin-left: 20px;
        }
        .hero{
            height: 600PX;
            background-image: url(IMAGES/SUPER.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
        }
        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
        }
        .hero-content{
            position: absolute;
            top: 20%;
            left: 25%;
            transform: translate(-50%);
            color: aliceblue;
            z-index: 1;
        }
        .hero-content p{
            font-size: 16px;
            line-height: 1.5;
            max-width: 450px;
        }
        .hero-content h1{
            font-size: 45px;
            margin-bottom: 15px;
        }
        .hero-buttons{
            display: flex;
            gap: 15px;
        }
        .hero-buttons a{
            text-decoration: none;
            color:black;
            background-color: aliceblue;
            padding: 12px 25px;
            border-radius: 25px;
            transition: 0.3s ease;
        }
        .hero-buttons .learn-more{
            background-color: transparent;
            color: aliceblue;
            border: 1px solid white;
        }
        .hero-buttons a:hover{
            transform: translateY(-3px);
        }
        .booking-card{
            position: absolute;
            top: 45%;
            right: 15%;
            transform: translateY(-50%);
            z-index: 1;
            background-color: rgba(128,128,128,0.30);
            padding: 25px;
            width: 400px;
            height: 310px;
            border-radius: 15px;
            color: aliceblue;
        }
        .booking-card h2{
            margin-top: 0;
            margin-bottom: 25px;
        }
        .booking-card label{
            display: block;
            margin-bottom: 5px;
            color: aliceblue;
        }
        .booking-card select,.booking-card input{
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
            background-color: rgba(128,128,128,0.35);
            border: none;
            color: aliceblue;
            border-radius: 8px;
        }
        .booking-card button{
            width: 100%;
            padding: 12px;
            background-color: aliceblue;
            color: black;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .booking-card button:hover{
            background-color: rgb(134, 134, 134);
            transition: 0.3s ease;

        }
        .date-feild{
            display: flex;
            gap: 10px;
        }
        .date-feild > div{
            flex: 1;
        }
        .stats{
            display: flex;
            justify-content: center;
            gap: 7%;
            background-color: black;
            color: aliceblue;
        }
        .stats p{
            color: rgba(207, 207, 207, 0.767);
            margin-top: 0;
        }
        .stats > div{
            text-align: center;
        }
        .featured{
            margin-top: 100px;
            left: 25%;
            text-align: center;

        }
        .featured-btn{
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 150px;;
        }
        .featured-btn a{
            padding: 10px 20px;
            background-color: rgb(218, 216, 216);
            text-decoration: none;
            border-radius: 25px;
            color: black;
            transition: 0.3s ease;
        }
        .featured-btn a:hover{
            background-color: black;
            color: aliceblue;
            transition: 0.3s ease;
        }
        .booking-message {
            display: none;
           background-color: #f0fdf4;
           border: 1px solid #bbf7d0;
           border-radius: 12px;
           padding: 20px;
           margin-top: 20px;
           color: #166534;
           font-size: 15px;
           line-height: 2;
           white-space: pre-line;
           box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
           animation: bookingFadeIn 0.4s ease;
        }
        @keyframes bookingFadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
